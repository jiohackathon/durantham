services:
  - type: web
    name: duramint
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: APP_DATABASE
        value: supabase
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: JWT_SECRET
        generateValue: true
