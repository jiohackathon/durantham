- name: Supabase CLI Action
  uses: supabase/setup-cli@v3.0.1
  name: Supabase Database Backup

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual triggers

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Backup Database
        run: |
          mkdir -p supabase-backup
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" --role-only -f supabase-backup/roles.sql
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" --schema-only -f supabase-backup/schema.sql
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" --data-only --use-copy -f supabase-backup/data.sql

      - name: Commit and Push Backup
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add supabase-backup/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Supabase backup $(date +'%Y-%m-%d')" && git push)

